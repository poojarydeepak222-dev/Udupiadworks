<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Online Services | UdupiAdWorks</title><style>:root{--o:#ff7a00;--dark:#111;--line:#e7e7e7}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#171717;background:#f7f7f7}.top{background:#111;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:800}.brand span{color:var(--o)}.top a{color:#fff;text-decoration:none}.wrap{max-width:1050px;margin:auto;padding:35px 5%}.hero{background:#111;color:#fff;padding:35px;border-radius:18px;margin-bottom:22px}.hero h1{font-size:clamp(32px,7vw,55px);margin:0 0 10px}.hero p{color:#ccc;max-width:700px}.services{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:20px 0}.service{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px;cursor:pointer}.service.active{border:2px solid var(--o)}.service b{display:block;margin-bottom:5px}.service small{color:#666}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font:inherit}.field textarea{min-height:100px}.full{grid-column:1/-1}.btn{border:0;border-radius:9px;background:var(--o);color:#fff;padding:13px 18px;font-weight:700;cursor:pointer}.status{margin-top:12px;color:#555}.success{background:#eef9f0;border:1px solid #b7dfbd;border-radius:12px;padding:16px}.success a{display:inline-block;margin:7px 7px 0 0;padding:10px 13px;border-radius:8px;background:#111;color:#fff;text-decoration:none;font-weight:700}.note{font-size:12px;color:#777;margin-top:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header class="top"><div class="brand">Udupi<span>AdWorks</span></div><a href="./">← Main Website</a></header><main class="wrap"><section class="hero"><h1>Order Online Services</h1><p>Choose a service, send your business details and upload your logo or reference files. You will receive an order number to track progress and pay online when an amount is assigned.</p></section><div class="services" id="services"></div><section class="panel"><h2 id="formTitle">Place your order</h2><form id="orderForm"><div class="grid"><div class="field"><label>Name *</label><input id="name" required></div><div class="field"><label>Business name *</label><input id="business" required></div><div class="field"><label>Mobile *</label><input id="mobile" required inputmode="tel"></div><div class="field"><label>WhatsApp</label><input id="whatsapp" inputmode="tel"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Package</label><select id="package"><option>Standard</option><option>Premium</option><option>Express</option><option>Custom</option></select></div><div class="field full"><label>Address</label><input id="address"></div><div class="field full"><label>Requirements / text for the design *</label><textarea id="requirements" required placeholder="For visiting card: name, designation, mobile, WhatsApp, address, email, website, social links, preferred style, etc."></textarea></div><div class="field full"><label>Upload logo / photos / reference files</label><input id="files" type="file" multiple accept="image/jpeg,image/png,image/webp,application/pdf"><div class="note">Images/PDF only, up to 6 MB each.</div></div></div><button class="btn" type="submit">Submit Order</button><div id="status" class="status"></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://bjxbqhcgdwmluwjfawse.supabase.co','sb_publishable_Pba7tiTGZFh3lo-AcVitlA_6E-WA5ZJ');const services=['Visiting Card Design','Logo Design','Social Media Post Design','Reels & Video Editing','Banner / Flex Design','Brochure Design','Poster / Flyer Design','Website Creation','Google Business Profile Setup','Social Media Marketing','WhatsApp Marketing','Business Photography'];let selected='Visiting Card Design';const box=document.getElementById('services');services.forEach((s,i)=>{const d=document.createElement('div');d.className='service'+(i===0?' active':'');d.innerHTML='<b>'+s+'</b><small>Order online</small>';d.onclick=()=>{selected=s;document.querySelectorAll('.service').forEach(x=>x.classList.remove('active'));d.classList.add('active');document.getElementById('formTitle').textContent='Order: '+s};box.appendChild(d)});document.getElementById('orderForm').onsubmit=async e=>{e.preventDefault();const status=document.getElementById('status');status.textContent='Submitting order...';const orderNo='UAW-'+Date.now().toString().slice(-8);const mobile=document.getElementById('mobile').value.trim();const whatsapp=document.getElementById('whatsapp').value.trim();const payload={order_number:orderNo,service:selected,package:document.getElementById('package').value,name:document.getElementById('name').value.trim(),business:document.getElementById('business').value.trim(),mobile,email:document.getElementById('email').value.trim(),whatsapp,address:document.getElementById('address').value.trim(),requirements:document.getElementById('requirements').value.trim()};const r=await sb.from('uaw_service_orders').insert(payload).select('id,order_number').single();if(r.error){status.textContent='Could not submit order: '+r.error.message;return}const files=document.getElementById('files').files;for(const file of files){if(file.size>6*1024*1024){status.textContent='Order saved, but '+file.name+' is larger than 6 MB.';return}const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=r.data.order_number+'/'+Date.now()+'_'+safe;const up=await sb.storage.from('uaw-order-files').upload(path,file,{contentType:file.type,upsert:false});if(up.error){status.textContent='Order saved, but a file could not be uploaded: '+up.error.message;return}const fr=await sb.from('uaw_order_files').insert({order_id:r.data.id,file_path:path,file_name:file.name,file_type:file.type});if(fr.error){status.textContent='Order saved, but file record could not be saved.';return}}const wa=(whatsapp||mobile).replace(/\D/g,'');const msg='New UdupiAdWorks order '+r.data.order_number+' for '+selected+' from '+payload.name+'. Track: https://poojarydeepak222-dev.github.io/Udupiadworks/track-order.html';status.innerHTML='<div class="success"><b>Order submitted successfully.</b><br>Order number: <strong>'+r.data.order_number+'</strong><br><a href="track-order.html">Track Order</a><a href="payment.html">Pay Order</a>'+(wa?'<a href="https://wa.me/'+wa+'?text='+encodeURIComponent(msg)+'" target="_blank">Open WhatsApp</a>':'')+'</div>';document.getElementById('orderForm').reset()};</script></body></html>
