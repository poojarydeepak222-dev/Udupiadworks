<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order | UdupiAdWorks</title><style>body{margin:0;font-family:system-ui,Arial;background:#08090b;color:#fff}.wrap{max-width:650px;margin:auto;padding:70px 5%}.logo{font-weight:900;font-size:22px;color:#fff;text-decoration:none}.logo span{color:#ff6b00}.box{margin-top:45px;background:#111318;border:1px solid #ffffff14;border-radius:20px;padding:28px}.ey{color:#ff6b00;font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase}.h{font-size:44px;line-height:1;margin:10px 0}.sub{color:#999}.form{display:grid;gap:12px;margin-top:25px}input{padding:14px;border-radius:10px;border:1px solid #ffffff20;background:#0b0c0f;color:#fff}button{padding:14px;border:0;border-radius:10px;background:#ff6b00;color:#fff;font-weight:900;cursor:pointer}.result{margin-top:20px}.status{padding:15px;border-radius:10px;background:#ffffff08}.bar{height:8px;background:#25272d;border-radius:99px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#ff6b00;width:20%}.pay{display:inline-block;margin-top:15px;background:#ff6b00;color:#fff;padding:11px 14px;border-radius:9px;text-decoration:none;font-weight:800}.back{display:inline-block;margin-top:25px;color:#aaa}</style></head><body><main class="wrap"><a class="logo" href="index.html">Udupi<span>AdWorks</span></a><section class="box"><div class="ey">Customer portal</div><h1 class="h">Track your order.</h1><p class="sub">Enter the order number and mobile number used when placing the order.</p><form class="form" onsubmit="track(event)"><input id="order" required placeholder="Order number"><input id="mobile" required inputmode="tel" placeholder="Mobile number"><button>Check Order Status →</button></form><div id="result" class="result"></div></section><a class="back" href="index.html">← Back to UdupiAdWorks</a></main><script>const API='https://bjxbqhcgdwmluwjfawse.supabase.co/functions/v1/uaw-track-order';async function track(e){e.preventDefault();const r=document.getElementById('result');r.innerHTML='<div class="status">Checking order...</div>';try{const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_number:document.getElementById('order').value,mobile:document.getElementById('mobile').value})});const j=await res.json();if(!res.ok)throw new Error(j.error||'Order not found');const o=j.order;const map={new:20,designing:40,preview_sent:60,revision:70,approved:85,completed:100};const p=map[String(o.status).toLowerCase()]||30;const canPay=Number(o.total_amount||0)>0&&!['paid'].includes(String(o.payment_status||'').toLowerCase());r.innerHTML='<div class="status"><b>'+o.order_number+'</b><br>'+o.service+(o.package?' • '+o.package:'')+'<div class="bar"><div class="fill" style="width:'+p+'%"></div></div><b>Status: '+o.status+'</b><br>Payment: '+(o.payment_status||'pending')+(o.total_amount!=null?' • ₹'+Number(o.total_amount).toLocaleString('en-IN'):'')+(canPay?'<br><a class="pay" href="payment.html?order='+encodeURIComponent(o.order_number)+'&mobile='+encodeURIComponent(document.getElementById('mobile').value)+'">Pay / Submit UPI Payment →</a>':'')+'</div>'}catch(err){r.innerHTML='<div class="status">'+err.message+'</div>'}}</script></body></html>
