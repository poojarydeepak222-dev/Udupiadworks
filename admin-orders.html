<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Online Orders | UdupiAdWorks Admin</title><style>:root{--bg:#0b0b0d;--card:#151519;--line:#292930;--o:#ff7a00;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:22px;font-weight:800}.brand span{color:var(--o)}button,select{font:inherit}.btn{background:var(--o);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.secondary{background:#292930;color:#fff;border:0;border-radius:8px;padding:10px 14px}.login{max-width:420px;margin:12vh auto;background:var(--card);padding:24px;border:1px solid var(--line);border-radius:15px}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}.field input,.field select{width:100%;padding:12px;background:#101014;color:#fff;border:1px solid var(--line);border-radius:8px}.msg{color:#ffb477;min-height:22px}.hidden{display:none}.filters{display:flex;gap:8px;overflow:auto;margin:18px 0}.filters select{background:#17171c;color:#fff;border:1px solid var(--line);border-radius:8px;padding:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:var(--muted);font-size:13px}.orderhead{display:flex;justify-content:space-between;gap:10px}.badge{background:#292930;border-radius:99px;padding:5px 9px;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.file{display:inline-block;color:#ffb477;margin:5px 8px 0 0}.green{background:#1d6b46}.red{background:#8e2c2c}@media(max-width:700px){.row{grid-template-columns:1fr}.orderhead{display:block}}</style></head><body><main class="wrap"><div class="top"><div class="brand">Udupi<span>AdWorks</span> <small class="muted">Online Orders</small></div><a href="admin.html"><button class="secondary">Main Admin</button></a></div><div id="login" class="login"><h2>Admin Login</h2><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="btn" id="loginBtn">Login</button><div id="loginMsg" class="msg"></div></div><div id="app" class="hidden"><div class="filters"><select id="statusFilter" onchange="loadOrders()"><option value="">All orders</option><option>new</option><option>designing</option><option>preview_sent</option><option>revision</option><option>approved</option><option>completed</option><option>cancelled</option></select><button class="btn" onclick="loadOrders()">Refresh</button></div><div id="orders"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://bjxbqhcgdwmluwjfawse.supabase.co','sb_publishable_Pba7tiTGZFh3lo-AcVitlA_6E-WA5ZJ');const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function admin(){const s=await sb.auth.getSession();if(!s.data.session)return false;const r=await sb.from('admin_users').select('user_id').eq('user_id',s.data.session.user.id).maybeSingle();return !r.error&&!!r.data}async function boot(){if(await admin()){$('login').classList.add('hidden');$('app').classList.remove('hidden');loadOrders()}}$('loginBtn').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){$('loginMsg').textContent=r.error.message;return}boot()};$('password').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};async function loadOrders(){const f=$('statusFilter').value;let q=sb.from('uaw_service_orders').select('*').order('created_at',{ascending:false});if(f)q=q.eq('status',f);const r=await q;if(r.error){$('orders').innerHTML='<div class="card">'+esc(r.error.message)+'</div>';return}if(!r.data.length){$('orders').innerHTML='<div class="card muted">No online service orders.</div>';return}$('orders').innerHTML=r.data.map(o=>`<div class="card"><div class="orderhead"><div><b>${esc(o.order_number)}</b><div class="muted">${esc(o.service)} · ${esc(o.package)}</div></div><span class="badge">${esc(o.status)}</span></div><div class="row" style="margin-top:12px"><div><b>${esc(o.name)}</b> · ${esc(o.business)}<br><span class="muted">Mobile: ${esc(o.mobile)} · WhatsApp: ${esc(o.whatsapp||'-')}</span><br><span class="muted">${esc(o.email||'')}</span></div><div><b>Amount:</b> ₹${Number(o.total_amount||0).toLocaleString('en-IN')}<br><span class="muted">Payment: ${esc(o.payment_status)}</span><br><span class="muted">${new Date(o.created_at).toLocaleString('en-IN')}</span></div></div><div style="margin-top:12px"><b>Requirements</b><div class="muted">${esc(o.requirements)}</div></div><div class="actions"><select onchange="setStatus(${o.id},this.value)">${['new','designing','preview_sent','revision','approved','completed','cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select><input id="amt${o.id}" type="number" min="0" value="${Number(o.total_amount||0)}" style="width:120px;padding:9px;border-radius:7px;border:1px solid #444;background:#101014;color:#fff"><button class="btn" onclick="setAmount(${o.id})">Save Amount</button><button class="secondary" onclick="setPayment(${o.id})">Mark Paid</button><a href="https://wa.me/${String(o.whatsapp||o.mobile).replace(/\D/g,'')}" target="_blank"><button class="green">WhatsApp</button></a><button class="secondary" onclick="files(${o.id})">Files</button></div><div id="f${o.id}" class="muted"></div></div>`).join('')}async function setStatus(id,status){const r=await sb.from('uaw_service_orders').update({status}).eq('id',id);if(r.error)alert(r.error.message);else loadOrders()}async function setAmount(id){const amount=Number($('amt'+id).value||0);const r=await sb.from('uaw_service_orders').update({total_amount:amount}).eq('id',id);if(r.error)alert(r.error.message);else loadOrders()}async function setPayment(id){const r=await sb.from('uaw_service_orders').update({payment_status:'paid'}).eq('id',id);if(r.error)alert(r.error.message);else loadOrders()}async function files(id){const r=await sb.from('uaw_order_files').select('*').eq('order_id',id).order('created_at');if(r.error){$('f'+id).textContent=r.error.message;return}if(!r.data.length){$('f'+id).textContent='No files';return}const links=[];for(const f of r.data){const s=await sb.storage.from('uaw-order-files').createSignedUrl(f.file_path,3600);links.push(s.error?'<span>'+esc(f.file_name)+'</span>':`<a class="file" href="${s.data.signedUrl}" target="_blank">${esc(f.file_name)}</a>`)}$('f'+id).innerHTML=links.join(' · ')}</script></body></html>
