<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pay Order | UdupiAdWorks</title><style>body{margin:0;font-family:system-ui,Arial;background:#08090b;color:#fff}.wrap{max-width:680px;margin:auto;padding:45px 5%}.logo{font-weight:900;font-size:22px;color:#fff;text-decoration:none}.logo span{color:#ff6b00}.box{margin-top:28px;background:#111318;border:1px solid #ffffff14;border-radius:20px;padding:25px}.ey{color:#ff6b00;font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase}.h{font-size:38px;line-height:1;margin:10px 0}.muted{color:#999}.form{display:grid;gap:12px;margin-top:20px}input,textarea{padding:14px;border-radius:10px;border:1px solid #ffffff20;background:#0b0c0f;color:#fff;font:inherit}button{padding:14px;border:0;border-radius:10px;background:#ff6b00;color:#fff;font-weight:900;cursor:pointer}.pay{background:#17191e;border:1px solid #ffffff12;border-radius:14px;padding:18px;margin-top:18px}.upi{font-size:22px;font-weight:900;word-break:break-all}.qr{width:220px;height:220px;display:block;margin:16px auto;border-radius:12px;background:#fff}.msg{margin-top:15px;color:#ffb477}.hidden{display:none}.back{display:inline-block;margin-top:20px;color:#aaa}</style></head><body><main class="wrap"><a class="logo" href="index.html">Udupi<span>AdWorks</span></a><section class="box"><div class="ey">Secure payment</div><h1 class="h">Pay your order.</h1><p class="muted">Enter your order number and the mobile number used when ordering.</p><form class="form" id="lookup"><input id="order" required placeholder="Order number"><input id="mobile" required inputmode="tel" placeholder="Mobile number"><button>Show Payment Details →</button></form><div id="payment" class="hidden"></div><div id="msg" class="msg"></div></section><a class="back" href="track-order.html">← Track another order</a></main><script>const API='https://bjxbqhcgdwmluwjfawse.supabase.co/functions/v1/uaw-track-order';const PAY='https://bjxbqhcgdwmluwjfawse.supabase.co/functions/v1/uaw-submit-payment';const $=id=>document.getElementById(id);let current=null;function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]) )}async function lookup(e){e.preventDefault();$('msg').textContent='Loading...';$('payment').classList.add('hidden');try{const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_number:$('order').value,mobile:$('mobile').value})});const j=await res.json();if(!res.ok)throw Error(j.error);current=j;const o=j.order,p=j.payment;if(String(o.payment_status).toLowerCase()==='paid'){ $('payment').innerHTML='<div class="pay"><b>Payment completed</b><p class="muted">Order '+esc(o.order_number)+' is marked as paid.</p></div>'; }else if(!p.upi_id){$('payment').innerHTML='<div class="pay"><b>Payment setup pending</b><p class="muted">UPI payment details have not been configured yet. Please contact UdupiAdWorks.</p></div>';}else{const amount=Number(o.total_amount||0);const upi='upi://pay?pa='+encodeURIComponent(p.upi_id)+'&pn='+encodeURIComponent(p.upi_name||'UdupiAdWorks')+'&am='+amount.toFixed(2)+'&cu=INR&tn='+encodeURIComponent(o.order_number);const qr='https://quickchart.io/qr?text='+encodeURIComponent(upi)+'&size=220';$('payment').innerHTML='<div class="pay"><div class="muted">Order</div><h2>'+esc(o.order_number)+'</h2><div class="muted">Amount to pay</div><div class="h">₹'+amount.toLocaleString('en-IN')+'</div><div class="muted">Pay to</div><div class="upi">'+esc(p.upi_id)+'</div><img class="qr" src="'+qr+'" alt="UPI QR"><p class="muted" style="text-align:center">Scan the QR code or use any UPI app. After payment, enter the transaction ID below.</p><button type="button" onclick="location.href='+JSON.stringify(upi)+'">Open UPI App</button><form class="form" id="proof"><input id="tx" required placeholder="UPI transaction / UTR ID"><textarea id="notes" placeholder="Optional note"></textarea><button>Submit Payment Confirmation</button></form></div>';$('proof').onsubmit=submitProof}$('payment').classList.remove('hidden');$('msg').textContent=''}catch(e){$('msg').textContent=e.message||'Unable to load payment details.'}}async function submitProof(e){e.preventDefault();$('msg').textContent='Submitting payment confirmation...';const res=await fetch(PAY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_number:$('order').value,mobile:$('mobile').value,amount:Number(current.order.total_amount||0),transaction_id:$('tx').value,notes:$('notes').value})});const j=await res.json();$('msg').textContent=res.ok?(j.message||'Submitted.'):(j.error||'Unable to submit payment.')}$('lookup').onsubmit=lookup;</script></body></html>
