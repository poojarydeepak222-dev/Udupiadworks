<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pay Order | UdupiAdWorks</title><script src="https://checkout.razorpay.com/v1/checkout.js"></script><style>body{margin:0;font-family:system-ui,Arial;background:#08090b;color:#fff}.wrap{max-width:680px;margin:auto;padding:45px 5%}.logo{font-weight:900;font-size:22px;color:#fff;text-decoration:none}.logo span{color:#ff6b00}.box{margin-top:28px;background:#111318;border:1px solid #ffffff14;border-radius:20px;padding:25px}.ey{color:#ff6b00;font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase}.h{font-size:38px;line-height:1;margin:10px 0}.muted{color:#999}.form{display:grid;gap:12px;margin-top:20px}input,textarea{padding:14px;border-radius:10px;border:1px solid #ffffff20;background:#0b0c0f;color:#fff;font:inherit}button{padding:14px;border:0;border-radius:10px;background:#ff6b00;color:#fff;font-weight:900;cursor:pointer;width:100%}.pay{background:#17191e;border:1px solid #ffffff12;border-radius:14px;padding:18px;margin-top:18px}.msg{margin-top:15px;color:#ffb477}.success{color:#72e6a0}.hidden{display:none}.back{display:inline-block;margin-top:20px;color:#aaa}</style></head><body><main class="wrap"><a class="logo" href="index.html">Udupi<span>AdWorks</span></a><section class="box"><div class="ey">Secure online payment</div><h1 class="h">Pay your order.</h1><p class="muted">Enter your order number and the mobile number used when ordering.</p><form class="form" id="lookup"><input id="order" required placeholder="Order number"><input id="mobile" required inputmode="tel" placeholder="Mobile number"><button>Continue to Secure Payment →</button></form><div id="payment" class="hidden"></div><div id="msg" class="msg"></div></section><a class="back" href="track-order.html">← Track another order</a></main><script>const API='https://bjxbqhcgdwmluwjfawse.supabase.co/functions/v1/uaw-create-payment';const VERIFY='https://bjxbqhcgdwmluwjfawse.supabase.co/functions/v1/uaw-verify-payment';const $=id=>document.getElementById(id);let current=null;function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function lookup(e){e.preventDefault();$('msg').textContent='Preparing secure payment...';$('payment').classList.add('hidden');try{const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_number:$('order').value.trim(),mobile:$('mobile').value.trim()})});const j=await res.json();if(!res.ok)throw Error(j.error||'Unable to prepare payment');if(j.paid){$('payment').innerHTML='<div class="pay"><b class="success">✓ Payment already completed</b><p class="muted">Order '+esc(j.order.order_number)+' is marked as paid.</p></div>';$('payment').classList.remove('hidden');$('msg').textContent='';return}current=j;$('payment').innerHTML='<div class="pay"><div class="muted">Order</div><h2>'+esc(j.order_number)+'</h2><div class="muted">Amount</div><div class="h">₹'+(j.amount/100).toLocaleString('en-IN')+'</div><p class="muted">Click below to pay securely using UPI, cards or net banking.</p><button id="payBtn">Pay ₹'+(j.amount/100).toLocaleString('en-IN')+' Securely</button></div>';$('payment').classList.remove('hidden');$('payBtn').onclick=openCheckout;$('msg').textContent=''}catch(e){$('msg').textContent=e.message||'Unable to load payment.'}}function openCheckout(){const options={key:current.key_id,amount:current.amount,currency:current.currency,name:'UdupiAdWorks',description:'Payment for '+current.order_number,order_id:current.razorpay_order_id,prefill:{name:current.name||'',contact:current.mobile||''},theme:{color:'#ff6b00'},handler:async function(response){$('msg').textContent='Verifying payment...';try{const payload={...response,order_number:current.order_number};const r=await fetch(VERIFY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok||!j.success)throw Error(j.error||'Payment verification failed');$('payment').innerHTML='<div class="pay"><b class="success">✓ Payment successful</b><p>Payment ID: '+esc(j.payment_id)+'</p><p class="muted">Your order is now marked as paid automatically.</p><button onclick="location.href=\'track-order.html?order='+encodeURIComponent(current.order_number)+'&mobile='+encodeURIComponent(current.mobile)+'\'">View Order Status</button></div>';$('msg').textContent='';}catch(e){$('msg').textContent=e.message||'Payment was received but verification is pending. Please check your order status.'}},modal:{ondismiss:function(){$('msg').textContent='Payment window closed. You can try again.'}}};const rzp=new Razorpay(options);rzp.open()}const params=new URLSearchParams(location.search);if(params.get('order'))$('order').value=params.get('order');if(params.get('mobile'))$('mobile').value=params.get('mobile');if(params.get('order')&&params.get('mobile'))lookup({preventDefault:()=>{}});$('lookup').onsubmit=lookup;</script></body></html>
