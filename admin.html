<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UdupiAdWorks Admin</title><style>body{font-family:Arial;background:#111;color:#fff;padding:20px;max-width:900px;margin:auto}input,button{display:block;width:100%;padding:14px;margin:10px 0;box-sizing:border-box;border-radius:8px}input{background:#222;color:#fff;border:1px solid #555}button{background:#ff7a00;color:#fff;border:0;font-weight:bold}#dashboard{display:none}#loginStatus,#status{color:#bbb}</style></head><body><h1>UdupiAdWorks Admin</h1><section id="login"><h2>Admin Login</h2><input id="email" type="email" autocomplete="username" placeholder="Admin email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="loginBtn" type="button">Login</button><div id="loginStatus"></div></section><section id="dashboard"><button id="logout" type="button">Logout</button><h2>Customer Enquiries</h2><div id="status">Loading...</div><div id="rows"></div></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const client=window.supabase.createClient('https://bjxbqhcgdwmluwjfawse.supabase.co','sb_publishable_Pba7tiTGZFh3lo-AcVitlA_6E-WA5ZJ');const $=id=>document.getElementById(id);async function show(){const r=await client.auth.getSession();if(r.data.session){$('login').style.display='none';$('dashboard').style.display='block';load()}else{$('login').style.display='block';$('dashboard').style.display='none'}}async function load(){const r=await client.from('enquiries').select('created_at,name,mobile,business,service,message').order('created_at',{ascending:false});if(r.error){$('status').textContent=r.error.message;return}$('status').textContent=r.data.length+' enquiries loaded';$('rows').innerHTML=r.data.map(x=>'<p><b>'+x.name+'</b> | '+x.mobile+' | '+x.business+' | '+x.service+'<br>'+x.message+'</p>').join('')}$('loginBtn').onclick=async()=>{const e=$('email').value.trim(),p=$('password').value;$('loginStatus').textContent='Signing in...';const r=await client.auth.signInWithPassword({email:e,password:p});$('loginStatus').textContent=r.error?r.error.message:'Login successful';if(!r.error)show()};$('password').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};$('logout').onclick=async()=>{await client.auth.signOut();show()};show();</script></body></html>
