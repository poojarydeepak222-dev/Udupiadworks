<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UdupiAdWorks Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff;padding:20px}.wrap{max-width:1100px;margin:auto}.box{background:#1d1d1d;border:1px solid #333;border-radius:16px;padding:22px;margin:20px 0}h1{color:#ff7a00}input,button{padding:13px;border-radius:8px;border:1px solid #444;font:inherit}input{width:100%;margin:7px 0;background:#111;color:#fff}button{background:#ff7a00;color:#fff;font-weight:700;cursor:pointer}.danger{background:#444}.hidden{display:none}.status{color:#bbb;margin:10px 0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:750px}th,td{padding:12px;border-bottom:1px solid #333;text-align:left}th{color:#ff7a00}small{color:#aaa}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{background:#111;border:1px solid #333;border-radius:12px;padding:18px}.stat strong{font-size:28px;color:#ff7a00;display:block}</style></head><body><div class="wrap"><div class="top"><h1>UdupiAdWorks Admin</h1><button id="logout" class="danger hidden">Logout</button></div><div id="login" class="box"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Login</button><div id="loginStatus" class="status"></div></div><main id="dashboard" class="hidden"><div class="cards"><div class="stat"><small>Total enquiries</small><strong id="total">0</strong></div><div class="stat"><small>Latest enquiry</small><strong id="latest">—</strong></div></div><div class="box"><div class="top"><h2>Customer Enquiries</h2><button id="refresh">Refresh</button></div><div id="status" class="status"></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Name</th><th>Mobile</th><th>Business</th><th>Service</th><th>Message</th></tr></thead><tbody id="rows"></tbody></table></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://bjxbqhcgdwmluwjfawse.supabase.co',KEY='sb_publishable_Pba7tiTGZFh3lo-AcVitlA_6E-WA5ZJ',client=supabase.createClient(URL,KEY);const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}async function load(){ $('status').textContent='Loading enquiries...';const {data,error}=await client.from('enquiries').select('id,created_at,name,mobile,business,service,message').order('created_at',{ascending:false});if(error){$('status').textContent='Access denied or database error.';return}$('total').textContent=data.length;$('latest').textContent=data.length?new Date(data[0].created_at).toLocaleDateString(): '—';$('rows').innerHTML=data.map(x=>`<tr><td>${esc(new Date(x.created_at).toLocaleString())}</td><td>${esc(x.name)}</td><td>${esc(x.mobile)}</td><td>${esc(x.business)}</td><td>${esc(x.service)}</td><td>${esc(x.message)}</td></tr>`).join('');$('status').textContent=data.length+' enquiries loaded.'}async function check(){const {data:{session}}=await client.auth.getSession();if(session){$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');load()}else{$('login').classList.remove('hidden');$('dashboard').classList.add('hidden');$('logout').classList.add('hidden')}}$('loginBtn').onclick=async()=>{ $('loginStatus').textContent='Signing in...';const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginStatus').textContent=error?error.message:'Login successful';if(!error)check()};$('logout').onclick=async()=>{await client.auth.signOut();check()};$('refresh').onclick=load;client.auth.onAuthStateChange(()=>check());check();</script></body></html>
