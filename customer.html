<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Portal | UdupiAdWorks</title><style>body{margin:0;font-family:system-ui,Arial;background:#08090b;color:#fff}.wrap{max-width:700px;margin:auto;padding:45px 5%}.logo{font-size:22px;font-weight:900}.logo span{color:#ff6b00}.box{margin-top:35px;background:#111318;border:1px solid #ffffff14;border-radius:20px;padding:28px}.ey{color:#ff6b00;font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase}.h{font-size:40px;line-height:1;margin:10px 0}.sub,.muted{color:#999}.form{display:grid;gap:11px;margin-top:22px}input{padding:14px;border:1px solid #ffffff18;border-radius:10px;background:#0a0b0d;color:#fff}button{padding:14px;border:0;border-radius:10px;background:#ff6b00;color:#fff;font-weight:900}.secondary{background:#25272d}.hidden{display:none}.order{border:1px solid #ffffff12;border-radius:15px;padding:18px;margin-top:12px}.pill{display:inline-block;background:#ff6b0018;color:#ffad78;padding:5px 9px;border-radius:99px;font-size:11px}.row{display:flex;justify-content:space-between;gap:15px}.logout{color:#aaa;cursor:pointer}</style></head><body><main class="wrap"><a class="logo" href="index.html">Udupi<span>AdWorks</span></a><section class="box" id="auth"><div class="ey">Customer portal</div><h1 class="h">Your orders, in one place.</h1><p class="sub">Sign in with the email used for your UdupiAdWorks order.</p><form class="form" onsubmit="login(event)"><input id="email" type="email" required placeholder="Email address"><input id="password" type="password" required placeholder="Password"><input id="mobile" inputmode="tel" required placeholder="Mobile number used for order"><button>Sign In & View Orders →</button></form><p id="msg" class="muted"></p></section><section class="box hidden" id="dash"><div class="row"><div><div class="ey">My account</div><h2>My Orders</h2></div><span class="logout" onclick="logout()">Sign out</span></div><div id="orders"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://bjxbqhcgdwmluwjfawse.supabase.co','sb_publishable_Pba7tiTGZFh3lo-AcVitlA_6E-WA5ZJ');async function login(e){e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Signing in...';const {data,error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.textContent=error.message;return}const r=await fetch('https://bjxbqhcgdwmluwjfawse.supabase.co/functions/v1/uaw-link-customer',{method:'POST',headers:{'Authorization':'Bearer '+data.session.access_token,'Content-Type':'application/json'},body:JSON.stringify({mobile:mobile.value})});const j=await r.json();if(!r.ok){msg.textContent=j.error;await sb.auth.signOut();return}document.getElementById('auth').classList.add('hidden');document.getElementById('dash').classList.remove('hidden');loadOrders()}async function loadOrders(){const {data,error}=await sb.from('uaw_service_orders').select('order_number,service,package,status,total_amount,payment_status,created_at').order('created_at',{ascending:false});const el=document.getElementById('orders');if(error){el.innerHTML='<p class="muted">Unable to load orders.</p>';return}el.innerHTML=data.length?data.map(o=>'<div class="order"><span class="pill">'+o.status+'</span><h3>'+o.service+'</h3><p class="muted">Order: '+o.order_number+'<br>Payment: '+(o.payment_status||'pending')+(o.total_amount!=null?' • ₹'+Number(o.total_amount).toLocaleString('en-IN'):'')+'</p></div>').join(''):'<p class="muted">No orders found.</p>'}async function logout(){await sb.auth.signOut();location.reload()}</script></body></html>
