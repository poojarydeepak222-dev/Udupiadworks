<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Portal | UdupiAdWorks</title><style>body{margin:0;font-family:system-ui,Arial;background:#08090b;color:#fff}.wrap{max-width:760px;margin:auto;padding:45px 5%}.logo{font-size:22px;font-weight:900;color:#fff;text-decoration:none}.logo span{color:#ff6b00}.box{margin-top:30px;background:#111318;border:1px solid #ffffff14;border-radius:20px;padding:26px}.ey{color:#ff6b00;font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase}.h{font-size:40px;line-height:1;margin:10px 0}.sub,.muted{color:#999}.form{display:grid;gap:11px;margin-top:22px}input{padding:14px;border:1px solid #ffffff18;border-radius:10px;background:#0a0b0d;color:#fff;font:inherit}button{padding:14px;border:0;border-radius:10px;background:#ff6b00;color:#fff;font-weight:900;cursor:pointer}.secondary{background:#25272d}.hidden{display:none}.order{border:1px solid #ffffff12;border-radius:15px;padding:18px;margin-top:12px}.pill{display:inline-block;background:#ff6b0018;color:#ffad78;padding:5px 9px;border-radius:99px;font-size:11px}.row{display:flex;justify-content:space-between;gap:15px;align-items:center}.logout{color:#aaa;cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions a{display:inline-block;padding:9px 12px;border-radius:8px;background:#25272d;color:#fff;text-decoration:none;font-size:13px;font-weight:700}.msg{color:#ffb477;min-height:22px}.tabs{display:flex;gap:8px;margin-top:16px}.tabs button{flex:1}.note{font-size:12px;color:#777;margin-top:8px}</style></head><body><main class="wrap"><a class="logo" href="index.html">Udupi<span>AdWorks</span></a><section class="box" id="auth"><div class="ey">Customer portal</div><h1 class="h">Your orders, in one place.</h1><p class="sub">Create an account or sign in using the email and mobile number used for your order.</p><div class="tabs"><button id="loginTab">Sign In</button><button class="secondary" id="signupTab">Create Account</button></div><form class="form" id="authForm"><input id="email" type="email" required placeholder="Email address"><input id="password" type="password" required minlength="6" placeholder="Password (6+ characters)"><input id="mobile" inputmode="tel" required placeholder="Mobile number used for order"><button id="submitBtn">Sign In & View Orders →</button></form><p id="msg" class="msg"></p><p class="note">Your order history is matched using your email + mobile number.</p></section><section class="box hidden" id="dash"><div class="row"><div><div class="ey">My account</div><h2>My Orders</h2></div><span class="logout" onclick="logout()">Sign out</span></div><div id="orders"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://bjxbqhcgdwmluwjfawse.supabase.co','sb_publishable_Pba7tiTGZFh3lo-AcVitlA_6E-WA5ZJ');const API='https://bjxbqhcgdwmluwjfawse.supabase.co/functions/v1/uaw-customer-orders';const $=id=>document.getElementById(id);let mode='login';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function setMode(m){mode=m;$('submitBtn').textContent=m==='login'?'Sign In & View Orders →':'Create Account & View Orders →';$('loginTab').className=m==='login'?'':'secondary';$('signupTab').className=m==='signup'?'':'secondary'}$('loginTab').onclick=()=>setMode('login');$('signupTab').onclick=()=>setMode('signup');$('authForm').onsubmit=async e=>{e.preventDefault();$('msg').textContent=mode==='login'?'Signing in...':'Creating account...';const email=$('email').value.trim().toLowerCase(),password=$('password').value,mobile=$('mobile').value.trim();let r=mode==='login'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});if(r.error){$('msg').textContent=r.error.message;return}if(mode==='signup'&&!r.data.session){$('msg').textContent='Account created. If email confirmation is enabled, confirm your email, then sign in.';return}await loadOrders(mobile)}async function loadOrders(mobile){const s=await sb.auth.getSession();if(!s.data.session){$('msg').textContent='Please sign in.';return}const res=await fetch(API,{method:'POST',headers:{Authorization:'Bearer '+s.data.session.access_token,'Content-Type':'application/json'},body:JSON.stringify({mobile})});const j=await res.json();if(!res.ok){$('msg').textContent=j.error||'Unable to load orders.';return}$('auth').classList.add('hidden');$('dash').classList.remove('hidden');const el=$('orders');el.innerHTML=j.orders.length?j.orders.map(o=>'<div class="order"><span class="pill">'+esc(o.status)+'</span><h3>'+esc(o.service)+'</h3><p class="muted">Order: '+esc(o.order_number)+'<br>Payment: '+esc(o.payment_status||'pending')+(o.total_amount!=null?' • ₹'+Number(o.total_amount).toLocaleString('en-IN'):'')+'</p><div class="actions"><a href="track-order.html?order='+encodeURIComponent(o.order_number)+'">Track</a>'+((Number(o.total_amount||0)>0&&String(o.payment_status||'').toLowerCase()!=='paid')?'<a href="payment.html?order='+encodeURIComponent(o.order_number)+'&mobile='+encodeURIComponent(mobile)+'">Pay</a>':'')+'</div></div>').join(''):'<p class="muted">No orders found.</p>'}async function logout(){await sb.auth.signOut();location.reload()}</script></body></html>
